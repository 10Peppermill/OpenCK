name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
    QT_VERSION: 5.15.2

jobs:
  build:
    name: "Build"
    strategy:
        matrix:
            os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install dependencies (linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt -y update
        sudo apt install qtbase5-dev libgl1-mesa-dev

    - name: Install dependencies (windows)
      if: matrix.os == 'windows-latest'
      run: echo "This does nothing"
    - name: Setup Python 3.12
      if: matrix.os == 'windows-latest'
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install Qt
      if: matrix.os == 'windows-latest'
      uses: jurplel/install-qt-action@v4
      with:
        version:      ${{ env.QT_VERSION }}
        host:         windows
        target:       desktop
        arch:         win64_msvc2019_64
        dir:          ${{ runner.temp }}
        setup-python: false
    - name: Set Qt Environment Variables
      if: matrix.os == 'windows-latest'
      run: |
        echo "Setting Qt Environment Variables"
        echo "QTDIR=${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/msvc2019_64" >> $GITHUB_ENV
        echo "QtToolsPath=${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/msvc2019_64/bin" >> $GITHUB_ENV
      shell: bash

    - uses: actions/checkout@v4
    - name: build
      run: |
        mkdir build
        cd build
        cmake ../
        make
        tree /f /a